name: "triage-issue"
description: "Composite action to run monthly triage JS script"
runs:
  using: "composite"
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
    - name: Install dependencies
      run: npm ci
      shell: bash
    - name: Run monthly triage script
      run: node .github/scripts/ensureMonthlyTriage.js
      shell: bash