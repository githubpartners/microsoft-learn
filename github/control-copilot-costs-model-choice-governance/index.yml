summary: Learn to monitor Copilot usage, choose models for business tasks, set spending controls, and govern agentic work with human review.
abstract: |
  In this module, you'll:
  - Explain what drives Copilot costs, including tokens, context, model prices, AI credits, and GitHub Actions minutes.
  - Read usage reports, find the cause of an increase, and set spending controls.
  - Choose a model and its settings for the task.
  - Limit what the agent can reach and keep human review where it matters.
  - Check AI-generated work against requirements and know when to stop.
prerequisites: |
  - A GitHub account.
  - A basic understanding of GitHub repositories, branches, commits, issues, and pull requests.
  - Familiarity with GitHub Copilot and its basic capabilities.
